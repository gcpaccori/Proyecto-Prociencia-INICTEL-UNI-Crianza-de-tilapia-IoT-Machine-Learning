[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaculture-digital-twin-backend"
version = "0.1.0"
description = "Backend base para Gemelo Digital acuicola."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "cryptography>=42,<47",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pymysql>=1.1,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
app = "backend.app.main:app"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["backend/app/tests"]
